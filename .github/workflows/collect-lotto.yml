name: Collect Lotto 6/45 Data

on:
  schedule:
    # 매주 일요일 KST 09:00 (UTC 일요일 00:00) — 로또 추첨일(토요일 20:35) 이후
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run collector
        run: python collect_lotto.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet data/lotto.json; then
            echo "변경사항 없음 — 커밋 건너뜀"
            exit 0
          fi

          LATEST=$(python -c "import json; d=json.load(open('data/lotto.json')); print(f\"{d[-1]['round']}회차 ({d[-1]['date']})\")")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotto.json
          git commit -m "로또 데이터 ${LATEST} 자동 업데이트"
          git push
