name: Collect Pension Lottery Data

on:
  schedule:
    # 매주 금요일 KST 09:00 (UTC 금요일 00:00) — 연금복권 추첨일(목요일 저녁) 이후
    - cron: "0 0 * * 5"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run collector
        run: python collect_pension.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet data/pension.json; then
            echo "변경사항 없음 — 커밋 건너뜀"
            exit 0
          fi

          LATEST=$(python -c "import json; d=json.load(open('data/pension.json')); print(f\"{d[-1]['round']}회차 ({d[-1]['date']})\")")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pension.json
          git commit -m "연금복권 데이터 ${LATEST} 자동 업데이트"
          git push
